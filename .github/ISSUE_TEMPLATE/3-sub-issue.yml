name: "Sub-issue"
description: "Sub-issue tecnica no formato [Label] [Type] - Descricao"
projects: ["CLT-Devops/3"]
type: "Task"
body:
  - type: dropdown
    id: label
    attributes:
      label: Label
      description: Label obrigatoria para classificacao.
      options:
        - DB
        - AI
        - Code
        - Server
        - Domain
        - Story
        - API
        - Webhook
        - AWS
        - ETL
        - Docker
        - CI/CD
        - Log
        - QA
        - Sec
        - UI/UX
        - Layout
        - Component
    validations:
      required: true

  - type: dropdown
    id: type
    attributes:
      label: Type
      description: Type obrigatorio da sub-issue.
      options:
        - Task
        - Bug
    validations:
      required: true

  - type: textarea
    id: description_text
    attributes:
      label: Descricao
      placeholder: "Descreva resumidamente a demanda..."
    validations:
      required: true
